# Render blueprint: the Docker image serves the Python API and built React UI.
services:
  - type: web
    name: aib-life-sla-governance
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Point writable state at a mounted disk. On the free plan there is no disk, so this
      # resolves to the ephemeral filesystem and the server loads the delivered extracts from Claude_Data/ on
      # each cold start. Add a disk (paid plan) and uploads survive restarts.
      - key: DATA_DIR
        value: /var/data
    # Uncomment together with a paid plan for state that survives restarts:
    # disk:
    #   name: aib-data
    #   mountPath: /var/data
    #   sizeGB: 1
